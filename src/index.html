<!doctype html>
<html lang="bs" data-theme="night">
<head>
  <meta charset="utf-8">
  <title>Viking | Auto Servis Jablanica</title>
  <meta name="description" content="Viking Auto Servis Jablanica — Vulkanizerske usluge, pranje auta i punjenje auto klima. Brza i profesionalna usluga. Pozovite nas!">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#0D0D0D" id="meta-theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Open Graph / Instagram preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Viking | Auto Servis Jablanica">
  <meta property="og:description" content="Vulkanizerske usluge, pranje auta i punjenje auto klima. Brza i profesionalna usluga u Jablanici.">
  <meta property="og:image" content="assets/logo.png">
  <meta property="og:url" content="https://viking-jablanica.ba">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Viking | Auto Servis Jablanica">
  <meta name="twitter:description" content="Vulkanizerske usluge, pranje auta i punjenje auto klima.">

  <!-- FOWT Prevention: apply saved theme before anything renders -->
  <script>
    (function() {
      var t = localStorage.getItem('viking.theme') || 'night';
      if (t === 'day' || t === 'night') {
        document.documentElement.setAttribute('data-theme', t);
      }
      var meta = document.getElementById('meta-theme-color');
      if (meta) {
        meta.setAttribute('content', t === 'night' ? '#0D0D0D' : '#FAFAF8');
      }
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700;800;900&display=swap">

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="assets/gallery/banner.webp?v=3" fetchpriority="high">
  <base href="/">

  <!-- Splash screen styles (inline to show before Angular loads) -->
  <style>
    .app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary, #FAFAF8);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .app-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      animation: splashPulse 1.5s ease-in-out infinite;
    }
    .splash-text {
      margin-top: 1rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--text-primary, #1A1614);
    }
    .splash-bar {
      margin-top: 1.5rem;
      width: 120px;
      height: 3px;
      background: var(--bg-secondary, #F0EEED);
      border-radius: 3px;
      overflow: hidden;
    }
    .splash-bar-fill {
      width: 40%;
      height: 100%;
      background: #C83C2C;
      border-radius: 3px;
      animation: splashSlide 1.2s ease-in-out infinite;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes splashSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <!-- Branded splash screen (hidden by Angular after init) -->
  <div class="app-splash" id="appSplash">
    <img src="assets/logo.png" alt="Viking" class="splash-logo" width="80" height="80">
    <span class="splash-text">VIKING</span>
    <div class="splash-bar">
      <div class="splash-bar-fill"></div>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
